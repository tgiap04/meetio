name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assert-shared-has-no-runtime-deps:
    name: packages/shared has zero runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert dependencies field is empty or absent
        run: |
          DEPS=$(node -e "const pkg = require('./packages/shared/package.json'); const deps = pkg.dependencies || {}; console.log(Object.keys(deps).length)")
          if [ "$DEPS" != "0" ]; then
            echo "packages/shared/package.json has $DEPS runtime dependencies — it must stay types-only."
            node -e "console.log(require('./packages/shared/package.json').dependencies)"
            exit 1
          fi
          echo "packages/shared has 0 runtime dependencies."

  assert-no-tests-in-expo-router-app-dir:
    name: apps/mobile/app contains routes only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no test files under apps/mobile/app
        run: |
          # Expo Router turns EVERY file under app/ into a route. A test file there
          # collides with the route it sits next to and pulls Jest globals into the
          # app bundle, crashing the running app with "Property 'jest' doesn't exist".
          # Typecheck, lint and the test suite all stay green, so only this catches it.
          FOUND=$(find apps/mobile/app -type f \( -name '*.test.*' -o -name '*.spec.*' \) 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "Test files found under apps/mobile/app — move them to apps/mobile/src:"
            echo "$FOUND"
            exit 1
          fi
          echo "apps/mobile/app contains routes only."

  build-and-test:
    name: install, typecheck, lint, test, build
    runs-on: ubuntu-latest

    # Real Postgres and Redis rather than mocks. This schema lives on HNSW
    # indexes, an expression-based trigram index, CITEXT, PG enums, partial
    # indexes and cascade rules — none of which a mock can prove. The image
    # matches docker-compose.yml so CI and local dev exercise the same engine.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: meetio
          POSTGRES_PASSWORD: meetio
          POSTGRES_DB: meetio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI values. The secrets are meaningless outside this job — the
      # tests only need them to be present and non-empty.
      DATABASE_URL: postgresql://meetio:meetio@localhost:5432/meetio
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-access-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      # The first migration installs vector, unaccent and pg_trgm, so this also
      # stands in for the init script docker-compose mounts locally. Service
      # containers cannot mount volumes, so the extensions have to arrive here.
      - name: Run migrations
        run: yarn workspace @meetio/api run migration:run

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      # Gated because it broke silently once: the generator ran TypeScript source
      # through tsx while the app runs compiled output, so a value imported from
      # @meetio/shared resolved in one path and not the other. Nothing caught it
      # because this command was not in CI, and openapi.json went stale for
      # several phases.
      - name: Generate OpenAPI document
        run: yarn workspace @meetio/api run openapi:generate
